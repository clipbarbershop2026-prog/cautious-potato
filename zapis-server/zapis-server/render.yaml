services:
  - type: web
    name: navbat
    runtime: node
    plan: starter
    buildCommand: echo "no build needed"
    startCommand: node server.js
    envVars:
      - key: TZ
        value: Asia/Tashkent
      - key: SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
